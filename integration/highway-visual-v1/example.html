<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Highway Visual Contract V1 — asset placement demo</title><style>body{margin:0;background:#17202a;color:white;font:14px system-ui}canvas{display:block;width:100%;height:90vh}header{padding:10px}button{margin-left:12px}</style><header>Read-only A.4.2 road · demonstration posts at ±15.9m · no game physics, no publication <button id="jump">Move 2000m / rebase</button></header><canvas id="view"></canvas><script type="module">
import * as T from './reference/three.module.js';import {Highway} from './reference/highway.js';import {buildHighwayWorld} from './reference/highway-world.js';import {createA42RoadAdapter,exampleRegistry,createSegmentVisuals,periodicAnchors} from './VISUAL_INTEGRATION_EXAMPLE.js';
const canvas=document.querySelector('canvas'),renderer=new T.WebGLRenderer({canvas,antialias:false});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));const scene=new T.Scene();scene.background=new T.Color(0xa5bdc8);scene.fog=new T.FogExp2(0xa5bdc8,.0017);scene.add(new T.HemisphereLight(0xffffff,0x526344,2));const sun=new T.DirectionalLight(0xffead1,2);sun.position.set(50,100,40);scene.add(sun);
const road=new Highway(86);road.reset();const world=buildHighwayWorld(road);world.root.visible=true;scene.add(world.root);const api=createA42RoadAdapter(road),registry=exampleRegistry(),camera=new T.PerspectiveCamera(60,1,.05,1500);let at=0,segments=[];
function place(){for(const v of segments)v.release();segments=[];const k=Math.floor(at/200);world.update(at);for(let i=k-2;i<=k+5;i++){const segment={key:i,s0:i*200,s1:(i+1)*200},anchors=[-15.9,15.9].flatMap(t=>periodicAnchors(segment,{id:'demo-post'+t,assetId:'demo.reflector-post',t,spacing:40}));const v=createSegmentVisuals(api,registry,segment,anchors);segments.push(v);scene.add(v.root);}const p=road.point(at,-7.4),f=road.point(at+60,-7.4);camera.position.set(p.x,p.y+1.2,p.z);camera.up.set(0,1,0);camera.lookAt(f.x,f.y+1.2,f.z);render();}
function render(){renderer.setSize(canvas.clientWidth,canvas.clientHeight,false);camera.aspect=canvas.clientWidth/canvas.clientHeight;camera.updateProjectionMatrix();renderer.render(scene,camera);}
window.addEventListener('resize',render);document.querySelector('#jump').onclick=()=>{at+=2000;road.origin=at;place();};place();
</script></html>
