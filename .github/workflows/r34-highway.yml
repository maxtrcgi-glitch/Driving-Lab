name: R3.4 asset highway WebGL
on:
  workflow_dispatch:
  push:
    branches: [visual/asset-poc-r2]
    paths: ['.github/workflows/r34-highway.yml', 'experiments/asset-poc-r2/r34/**']
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps --only-shell chromium
      - run: python3 -m pip install --user --break-system-packages Pillow
      - run: python3 experiments/asset-poc-r2/r34/inspect.py
      - run: node experiments/asset-poc-r2/r34/test.mjs
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: r34-webgl-comparison
          path: reports/r34/
      - name: Bundle runnable showcase
        run: |
          src=experiments/asset-poc-r2
          mkdir -p demo/assets/asphalt-track demo/r31/assets demo/viewer
          cp -r "$src/r34" "$src/r23c" demo/
          cp -r "$src/viewer/vendor" "$src/viewer/utils" demo/viewer/
          cp "$src"/assets/asphalt-track/*_1k.jpg demo/assets/asphalt-track/
          cp "$src/assets/asphalt-track/manifest.json" demo/assets/asphalt-track/
          cp "$src/r31/assets/guardrail.glb" demo/r31/assets/
          echo '<!doctype html><meta http-equiv="refresh" content="0; url=r34/"><a href="r34/">R3.4 highway</a>' > demo/index.html
      - uses: actions/upload-artifact@v5
        with:
          name: r34-runnable-showcase
          path: demo/
