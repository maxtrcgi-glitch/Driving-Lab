name: R2.2a Asphalt PBR comparison
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps --only-shell chromium
      - name: Verify committed source hashes
        run: python3 experiments/asset-poc-r2/tools/r22a-verify.py
      - run: node experiments/asset-poc-r2/tests/r22a-webgl.mjs
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: r22a-asphalt-comparison
          path: reports/road-r22a/
          if-no-files-found: warn
