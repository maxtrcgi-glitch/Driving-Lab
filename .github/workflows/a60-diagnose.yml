name: A60 failed-log diagnostic
on:
  push:
    branches: [core/traffic-ai3]
    paths: [.github/workflows/a60-diagnose.yml]
permissions:
  contents: read
jobs:
  compatibility-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Current rolling-start and unchanged physics contracts
        run: node tests/release013.mjs
      - name: Current recycling and allocation contracts
        if: always()
        run: node tests/traffic-experience.mjs

# Verify corrected visibility expression syntax.
