<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><title>Driving Lab — Road material comparison</title><style>body{margin:0;background:#b6c9d8;font:14px system-ui}#ui{position:absolute;top:10px;left:10px;background:#fffD;padding:8px;border-radius:5px}button{padding:6px;margin:2px}canvas{display:block}#status{font-size:12px}</style><script type="importmap">{"imports":{"three":"../viewer/vendor/three.module.js"}}</script></head><body><div id="ui"><button id="variant">Material A</button><button id="camera">Driver</button><button id="light">Daylight</button><button id="motion">Drive off</button><div id="status"></div></div><script type="module">
import * as T from 'three';import {createRoadBaseline} from './road-surface.mjs';import {createRoadImproved} from './road-surface-improved.mjs';
const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(1);renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1;renderer.debug.checkShaderErrors=true;document.body.append(renderer.domElement);
const scene=new T.Scene();scene.background=new T.Color(0xb6c9d8);scene.add(new T.HemisphereLight(0xcde3ff,0x777068,1.2));const sun=new T.DirectionalLight(0xffedce,2.3);sun.position.set(8,8,4);scene.add(sun);const camera=new T.PerspectiveCamera(45,innerWidth/innerHeight,.1,400);let mode='A',view='driver',grazing=false,moving=false,travel=0,dt=0,last=performance.now();
const loader=new T.TextureLoader(),maps=await Promise.all(['diff','nor_gl','rough'].map(k=>loader.loadAsync(`../assets/asphalt-track/asphalt_track_${k}_1k.jpg`)));const anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());let options={color:maps[0],normal:maps[1],roughness:maps[2],widthMetres:12,lengthMetres:250,anisotropy};const A=createRoadBaseline(T,options),B=createRoadImproved(T,{...options,startMm:0n});
for(let i=0;i<5;i++){const geometry=new T.PlaneGeometry(12,50);let uv=geometry.attributes.uv;const coord=[];for(let j=0;j<uv.count;j++){const u=uv.getX(j),v=uv.getY(j);coord.push(u*12,(i+v)*50);uv.setY(j,(i+v)/5)}uv.needsUpdate=true;geometry.setAttribute('roadLocalMetres',new T.Float32BufferAttribute(coord,2));const mesh=new T.Mesh(geometry,A);mesh.rotation.x=-Math.PI/2;mesh.position.z=-(i*50+25);mesh.userData.road=true;scene.add(mesh)}
function configure(){for(const o of scene.children)if(o.userData.road)o.material=mode==='A'?A:B;sun.position.set(...(grazing?[-7,2,-8]:[8,8,4]));if(view==='driver'){camera.position.set(0,1.4,-Math.min(travel,200));camera.lookAt(0,0,-Math.min(travel+40,249))}else if(view==='close'){camera.position.set(1,0.55,-Math.min(travel,230));camera.lookAt(0,0,-Math.min(travel+5,249))}else{camera.position.set(20,35,-Math.min(travel+30,220));camera.lookAt(0,0,-Math.min(travel+45,240))}renderer.render(scene,camera)}
window.setState=({variant=mode,cameraView=view,lowSun=grazing,distance=travel,drive=moving}={})=>{if(!['A','B'].includes(variant)||!['driver','close','overview'].includes(cameraView))throw Error('invalid state');mode=variant;view=cameraView;grazing=lowSun;travel=distance;moving=drive;configure();return window.getStats()};window.getStats=()=>({variant:mode,view,grazing,travel,calls:renderer.info.render.calls,triangles:renderer.info.render.triangles,textures:renderer.info.memory.textures,error:renderer.getContext().getError(),anisotropy,frameMs:dt});
function labels(){document.querySelector('#variant').textContent='Material '+mode;document.querySelector('#camera').textContent=view;document.querySelector('#light').textContent=grazing?'Low sun':'Daylight';document.querySelector('#motion').textContent=moving?'Drive on':'Drive off'}
document.querySelector('#variant').onclick=()=>{mode=mode==='A'?'B':'A';labels()};document.querySelector('#camera').onclick=()=>{view=({driver:'close',close:'overview',overview:'driver'})[view];labels()};document.querySelector('#light').onclick=()=>{grazing=!grazing;labels()};document.querySelector('#motion').onclick=()=>{moving=!moving;labels()};addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});labels();configure();window.ready=true;
renderer.setAnimationLoop(now=>{dt=now-last;last=now;if(moving)travel=(travel+Math.min(dt,100)*33.333/1000)%200;configure();document.querySelector('#status').textContent=`${renderer.info.render.calls} draws / ${renderer.info.render.triangles} triangles / ${dt.toFixed(1)} ms frame`;});
</script></body></html>
