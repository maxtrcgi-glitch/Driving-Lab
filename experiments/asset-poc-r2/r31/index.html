<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><title>Asset inspection</title><style>body{margin:0;background:#aabac1}canvas{display:block}#ui{position:absolute;padding:8px;background:#ffffffdc;font:14px system-ui}button{padding:6px}</style><script type="importmap">{"imports":{"three":"../viewer/vendor/three.module.js","three/addons/":"../viewer/vendor/"}}</script></head><body><div id="ui"><button id="road">Road</button><button id="rail">Guardrail</button><button id="orbit">Orbit</button><button id="driver">Driver</button><button id="overview">Overview</button><button id="close">Close</button><span id="stats"></span></div><script type="module">
import * as T from 'three';import {GLTFLoader} from '../viewer/vendor/GLTFLoader.js';import {OrbitControls} from '../viewer/vendor/OrbitControls.js';
let renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(1);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1;renderer.debug.checkShaderErrors=true;document.body.append(renderer.domElement);let scene=new T.Scene();scene.background=new T.Color(0xb9c8cf);scene.add(new T.HemisphereLight(0xe7efff,0x88847c,2));let light=new T.DirectionalLight(0xfff3df,3);light.position.set(15,30,20);scene.add(light);let camera=new T.PerspectiveCamera(45,innerWidth/innerHeight,.05,500),controls=new OrbitControls(camera,renderer.domElement);let loader=new GLTFLoader(),models={};for(let [name,file] of [['road','highway-segment.glb'],['rail','guardrail.glb']]){let model=(await loader.loadAsync('./assets/'+file)).scene;model.visible=false;models[name]=model;scene.add(model)}let selected='road';
window.select=(name,view)=>{selected=name;for(let [k,v] of Object.entries(models))v.visible=k===name;let b=new T.Box3().setFromObject(models[name]),c=b.getCenter(new T.Vector3()),s=b.getSize(new T.Vector3());controls.target.copy(c);if(name==='road'){if(view==='driver'){camera.position.set(c.x-s.x*.40,b.min.y+1.2,c.z-s.z*.25);controls.target.set(c.x+s.x*.33,b.min.y+.2,c.z-s.z*.25)}else if(view==='roadside'){camera.position.set(c.x-s.x*.25,b.min.y+1.1,c.z-s.z*.58);controls.target.set(c.x+s.x*.2,b.min.y+.2,c.z-s.z*.18)}else if(view==='asphalt'||view==='marking'){camera.position.set(c.x,b.min.y+.7,c.z-s.z*.26);controls.target.set(c.x+3,b.min.y,c.z-s.z*.26)}else camera.position.set(c.x+s.x*.9,c.y+s.y+18,c.z+s.z*.9)}else{if(view==='close'||view==='detail')camera.position.set(c.x+s.x*.18,c.y+1,c.z+2);else camera.position.set(c.x+s.x*.35,c.y+5,c.z+12)}controls.update();renderer.render(scene,camera);let gl=renderer.getContext();let r={name,view,bounds:{min:b.min.toArray(),max:b.max.toArray(),size:s.toArray()},drawCalls:renderer.info.render.calls,triangles:renderer.info.render.triangles,textures:renderer.info.memory.textures,glerror:gl.getError(),webgl:gl.getParameter(gl.VERSION)};document.querySelector('#stats').textContent=JSON.stringify(r);return r};
for(let name of ['road','rail'])document.querySelector('#'+name).onclick=()=>window.select(name,'overview');for(let view of ['driver','overview','close','orbit'])document.querySelector('#'+view).onclick=()=>window.select(selected,view);window.select('road','overview');window.ready=true;renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});
</script></body></html>
