<script>
window.fail = message => {
 const status = document.getElementById('status');
 status.dataset.error = '';
 status.textContent = String(message);
 window.loadFailure = String(message);
};
window.deadline = setTimeout(() => window.fail('Loading timed out. Reload to retry.'), 35000);
addEventListener('error', event => window.fail(event.message || 'A required viewer file could not load.'), true);
</script>
