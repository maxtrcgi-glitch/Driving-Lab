<!doctype html><meta charset="utf-8"><title>Blender export validation</title><style>body{margin:0}#status{position:absolute;top:8px;left:8px;background:#fff;padding:6px}</style><div id="status">Loading Blender export</div><script type="importmap">{"imports":{"three":"../viewer/vendor/three.module.js"}}</script><script type="module">
import * as THREE from 'three';

try {
 const stats=await (await fetch('./blender-stats.json')).json();const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(1000,650);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;document.body.appendChild(renderer.domElement);
 const scene=new THREE.Scene();scene.background=new THREE.Color(0xbccbd6);scene.add(new THREE.HemisphereLight(0xdbe8ff,0x77776c,1.3));const sun=new THREE.DirectionalLight(0xfff3de,2.3);sun.position.set(-6,10,8);scene.add(sun);

 window.result={meshes,uv,normals,triangles,materials:materials.size,textures:textures.size,size:[size.x,size.z,size.y],glError:renderer.getContext().getError(),webgl:renderer.getContext().getParameter(renderer.getContext().VERSION),calls:renderer.info.render.calls};document.querySelector('#status').textContent='Ready';

</script>
