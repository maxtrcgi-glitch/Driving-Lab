<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta charset="utf-8"><title>Driving Lab | Highway R2.3c</title><style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#9db4c1;font:14px system-ui;color:#fff}canvas{display:block}#ui{position:absolute;top:env(safe-area-inset-top,10px);left:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}button{border:1px solid #ffffff66;background:#15242bdd;color:white;border-radius:6px;padding:9px 12px}#info{background:#15242bcc;padding:8px;border-radius:6px;font-size:12px}</style><script type="importmap">{"imports":{"three":"../viewer/vendor/three.module.js"}}</script></head><body><div id="ui"><button data-view="driver">Driver</button><button data-view="roadside">Roadside</button><button data-view="overview">Overview</button><button id="sun">Low sun</button><button id="drive">Drive</button><span id="info">Loading…</span></div><script type="module">
import * as T from 'three';
const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.2;renderer.debug.checkShaderErrors=true;document.body.appendChild(renderer.domElement);
const scene=new T.Scene();scene.background=new T.Color(0xb6c9d3);scene.fog=new T.Fog(0xb6c9d3,190,550);const camera=new T.PerspectiveCamera(52,innerWidth/innerHeight,.1,700);scene.add(new T.HemisphereLight(0xe4efff,0x8d8977,2));const sun=new T.DirectionalLight(0xfff0d5,3);sun.position.set(-60,95,40);scene.add(sun);
const loader=new T.TextureLoader();const maps=await Promise.all(['diff','nor_gl','rough'].map(n=>loader.loadAsync(`../assets/asphalt-track/asphalt_track_${n}_1k.jpg`)));for(const t of maps){t.wrapS=t.wrapT=T.RepeatWrapping;t.repeat.set(6.75,150);t.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());t.generateMipmaps=true;t.minFilter=T.LinearMipmapLinearFilter}maps[0].colorSpace=T.SRGBColorSpace;maps[1].colorSpace=maps[2].colorSpace=T.NoColorSpace;
const asphalt=new T.MeshStandardMaterial({map:maps[0],normalMap:maps[1],roughnessMap:maps[2],roughness:1,metalness:0});const shoulder=new T.MeshStandardMaterial({color:0x555452,roughness:1});const paint=new T.MeshStandardMaterial({color:0xbab8af,roughness:.9});const ground=new T.MeshStandardMaterial({color:0x858b6e,roughness:1});const metal=new T.MeshStandardMaterial({color:0x9b9d99,metalness:.55,roughness:.58});
function plane(w,l,x,y,mat){let m=new T.Mesh(new T.PlaneGeometry(w,l),mat);m.rotation.x=-Math.PI/2;m.position.set(x,y,-150);scene.add(m);return m}
// 3 x 3.5 m lanes, one paved 3 m shoulder, 2% crown.
const road=new T.Mesh(new T.PlaneGeometry(13.5,300,54,1),asphalt);road.rotation.x=-Math.PI/2;road.position.set(1.5,0,-150);scene.add(road);let pos=road.geometry.attributes.position;for(let i=0;i<pos.count;i++)pos.setZ(i,-Math.abs(pos.getX(i))*.02);pos.needsUpdate=true;road.geometry.computeVertexNormals();
function shoulderStrip(center,side){let m=plane(2,300,center,0,shoulder),a=m.geometry.attributes.position;for(let i=0;i<a.count;i++){let x=center+a.getX(i);let edge=side<0?-5.25:8.25;let drop=.135+Math.abs(x-edge)*.04;a.setZ(i,-drop)}a.needsUpdate=true;m.geometry.computeVertexNormals();return m}const leftShoulder=shoulderStrip(-6.25,-1),rightShoulder=shoulderStrip(9.25,1);plane(210,600,0,-.23,ground);
window.geometryCheck=()=>{const crown=road.geometry.attributes.position;let heights=[];for(let i=0;i<crown.count;i++)if(crown.getY(i)>0)heights.push([crown.getX(i),crown.getZ(i)]);return {heights,left:Array.from(leftShoulder.geometry.attributes.position.array),right:Array.from(rightShoulder.geometry.attributes.position.array)}};
function strip(x,z,length,width=.15){let y=.008-Math.abs(x-1.5)*.02;let m=new T.Mesh(new T.PlaneGeometry(width,length),paint);m.rotation.x=-Math.PI/2;m.position.set(x,y,z);scene.add(m)}
for(let x of [-5.15,5.15])strip(x,-150,300,.2);for(let x of [-1.75,1.75])for(let z=0;z<300;z+=18)strip(x,-z-3,6);
// W-beam-like rails and posts, instanced. Dimensions are approximate, not certified engineering.
function box(w,h,d,mat,x,y,z){let o=new T.Mesh(new T.BoxGeometry(w,h,d),mat);o.position.set(x,y,z);scene.add(o)}
// Folded profile approximates galvanized W-beam, extruded along the road.
const profile=new T.Shape();profile.moveTo(-.04,-.16);profile.lineTo(.015,-.12);profile.lineTo(-.025,-.07);profile.lineTo(.02,0);profile.lineTo(-.025,.07);profile.lineTo(.015,.12);profile.lineTo(-.04,.16);profile.lineTo(-.055,.15);profile.lineTo(-.055,-.15);profile.closePath();
for(let x of [-7.35,11.4]){let rail=new T.Mesh(new T.ExtrudeGeometry(profile,{depth:300,bevelEnabled:false,steps:1}),metal);rail.position.set(x,.62,-300);scene.add(rail);let posts=new T.InstancedMesh(new T.BoxGeometry(.1,.77,.1),metal,76),o=new T.Object3D();for(let i=0;i<76;i++){o.position.set(x,.27,-i*4);o.updateMatrix();posts.setMatrixAt(i,o.matrix)}scene.add(posts)}
const markerMat=new T.MeshStandardMaterial({color:0xddd9c8,roughness:.95}),markBlack=new T.MeshStandardMaterial({color:0x252a27,roughness:.9});for(let x of [-7.05,10.9]){let markers=new T.InstancedMesh(new T.BoxGeometry(.10,.75,.12),markerMat,7),reflectors=new T.InstancedMesh(new T.BoxGeometry(.103,.12,.125),markBlack,7),o=new T.Object3D();for(let i=0;i<7;i++){o.position.set(x,.18,-15-i*45);o.updateMatrix();markers.setMatrixAt(i,o.matrix);o.position.y=.35;o.updateMatrix();reflectors.setMatrixAt(i,o.matrix)}scene.add(markers,reflectors)}
// Restrained surface variation: sparse asphalt material regions, flush to road.
const wearMat=new T.MeshStandardMaterial({map:maps[0],roughness:.94,metalness:0,color:0xe8e6e1});
for(const [x,z,w,l] of [[1.7,-82,3.0,12],[-2.9,-191,1.5,6]]){let patch=plane(w,l,x,0,wearMat);patch.position.z=z;let a=patch.geometry.attributes.position;for(let i=0;i<a.count;i++)a.setZ(i,-Math.abs(x+a.getX(i)-1.5)*.02+.003);a.needsUpdate=true;patch.geometry.computeVertexNormals()}
let mode='driver',moving=false,low=false,distance=20,last=performance.now(),frame=0,speed=100;function setView(){if(mode==='driver'){camera.position.set(0,1.2,-distance);camera.lookAt(0,.15,-distance-55)}else if(mode==='roadside'){camera.position.set(9.4,1,-distance);camera.lookAt(-1,.2,-distance-35)}else{camera.position.set(35,24,-distance-15);camera.lookAt(0,0,-distance-60)}}
window.setScene=({view=mode,sunLow=low,move=moving,at=distance,kmh=speed}={})=>{mode=view;low=sunLow;moving=move;distance=at;speed=kmh;sun.position.set(...(low?[-75,9,-30]:[-60,95,40]));setView();renderer.render(scene,camera);return window.sceneStats()};window.sceneStats=()=>({view:mode,distance,calls:renderer.info.render.calls,triangles:renderer.info.render.triangles,textures:renderer.info.memory.textures,glError:renderer.getContext().getError(),version:renderer.getContext().getParameter(renderer.getContext().VERSION)});document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>window.setScene({view:b.dataset.view}));document.querySelector('#sun').onclick=()=>window.setScene({sunLow:!low});document.querySelector('#drive').onclick=()=>{moving=!moving;document.querySelector('#drive').textContent=moving?'Pause':'Drive'};addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});window.setScene();window.ready=true;renderer.setAnimationLoop(now=>{let dt=Math.min(now-last,80);last=now;if(moving)distance=(distance+dt/1000*speed/3.6)%230;setView();renderer.render(scene,camera);if(++frame%20===0)document.querySelector('#info').textContent=`${renderer.info.render.calls} draws · ${renderer.info.render.triangles} tris`;});
</script></body></html>
